[project]
name = "allcallall-sandbox-runner"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "anyio>=4,<5",
  "fastapi>=0.111,<1",
  "httpx>=0.27,<1",
  "mcp>=2.3.0,<3",
  "pydantic>=2.7,<3",
  "uvicorn[standard]>=0.54.0,<1",
]

[project.optional-dependencies]
dev = ["mypy>=2.4.0,<3", "pytest>=9.1.1,<10", "ruff>=0.17.0,<0.18"]

[tool.setuptools.packages.find]
include = ["allcallall_sandbox_runner*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
