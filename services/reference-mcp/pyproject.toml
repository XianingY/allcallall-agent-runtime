[project]
name = "allcallall-reference-mcp"
version = "0.1.0"
description = "Deterministic HTTPS MCP reference service for AllCallAll integrations"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.0.0,<2",
  "uvicorn[standard]>=0.54.0,<1",
]

[project.optional-dependencies]
dev = ["mypy>=2.4.0,<3", "pytest>=9.1.1,<10", "ruff>=0.17.0,<0.18"]

[tool.setuptools.packages.find]
include = ["allcallall_reference_mcp*", "allcallall_interview_mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
