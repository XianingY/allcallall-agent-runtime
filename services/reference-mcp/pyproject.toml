[project]
name = "allcallall-reference-mcp"
version = "0.1.0"
description = "Deterministic HTTPS MCP reference service for AllCallAll integrations"
requires-python = ">=3.11"
dependencies = [
  "mcp>=2.3.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["mypy>=1.10,<2", "pytest>=8.2,<9", "ruff>=0.15,<0.16"]

[tool.setuptools.packages.find]
include = ["allcallall_reference_mcp*", "allcallall_interview_mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
