[tool.ruff]
# 120, not 100: before ruff 0.17 the nested [tool.ruff] blocks in service
# pyprojects reset `select` for those directories to ruff's minimal default,
# so E501 was never actually enforced outside scripts/. Unifying the config
# surfaced ~256 long lines, 237 of which sit between 100 and 120 columns —
# the codebase's de facto width. Lines beyond 120 are fixed instead of
# re-flowed wholesale; adopt the measured standard rather than churn.
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true

# uv workspace: link the local runtime packages so `allcallall-shared` and the
# SDK resolve as path dependencies instead of PyPI lookups, and `uv.lock` pins
# the full (including dev/extra) dependency graph for reproducible builds.
[tool.uv.workspace]
members = [
    "services/agent-runtime",
    "services/rag-runtime",
    "services/sandbox-runner",
    "services/reference-mcp",
    "packages/shared",
    "packages/sdk",
]
