[project]
name = "allcallall-shared"
version = "0.1.0"
description = "Shared models, utilities, and scoring for AllCallAll Python runtimes"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = [
  "mypy>=2.4.0,<3",
  "pytest>=9.1.1,<10",
  "ruff>=0.17.0,<0.18",
]

[tool.setuptools.packages.find]
include = ["shared*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
