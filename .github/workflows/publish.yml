name: Publish Images

# Only publish on semantic version tags (v*.*.*). No more :latest pushes and
# every image is scanned with Trivy (HIGH,CRITICAL) before it is pushed.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

jobs:
  images:
    name: Build, scan and push (${{ matrix.runtime }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: agent-runtime
          - runtime: rag-runtime
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build ${{ matrix.runtime }}
        run: |
          docker build \
            -f services/${{ matrix.runtime }}/Dockerfile \
            -t ghcr.io/xianingy/allcallall-agent-runtime/${{ matrix.runtime }}:${GITHUB_REF_NAME} \
            .
      - name: Scan ${{ matrix.runtime }} with Trivy
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: ghcr.io/xianingy/allcallall-agent-runtime/${{ matrix.runtime }}:${GITHUB_REF_NAME}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Push ${{ matrix.runtime }}
        run: |
          docker push ghcr.io/xianingy/allcallall-agent-runtime/${{ matrix.runtime }}:${GITHUB_REF_NAME}
