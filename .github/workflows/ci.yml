name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: make install-dev
      - name: Verify uv.lock is in sync
        # The lock is the reproducibility contract for the published images
        # (Dockerfiles run `uv sync --frozen`). Fail early if a dependency
        # change lands without regenerating it.
        run: |
          pip install uv
          uv lock --check
      - name: Test
        run: make test
      - name: Lint
        run: make lint
      - name: Typecheck
        run: make typecheck
      - name: Documentation
        run: make docs-check
      - name: Contracts
        run: make contracts-check
      - name: Eval
        run: make agent-eval rag-eval

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build Agent Runtime
        run: docker build -f services/agent-runtime/Dockerfile -t allcallall-agent-runtime:ci .
      - name: Build RAG Runtime
        run: docker build -f services/rag-runtime/Dockerfile -t allcallall-rag-runtime:ci .
      - name: Build Sandbox Runner
        run: docker build -f services/sandbox-runner/Dockerfile -t allcallall-sandbox-runner:ci .
      # A build can succeed while the image is broken at runtime (e.g. a
      # missing module or a venv that cannot start); boot each image and probe
      # /health so that class of failure fails CI instead of the first deploy.
      - name: Smoke Test Agent Runtime
        run: |
          docker run -d --rm --name agent-smoke -p 18090:8090 allcallall-agent-runtime:ci
          for i in $(seq 1 30); do
            curl -sf http://localhost:18090/health && break
            sleep 1
          done
          curl -sf http://localhost:18090/health | grep -q '"status":"ok"' || { docker logs agent-smoke; exit 1; }
          docker stop agent-smoke
      - name: Smoke Test RAG Runtime
        run: |
          docker run -d --rm --name rag-smoke -p 18091:8091 allcallall-rag-runtime:ci
          for i in $(seq 1 30); do
            curl -sf http://localhost:18091/health && break
            sleep 1
          done
          curl -sf http://localhost:18091/health | grep -q '"status":"ok"' || { docker logs rag-smoke; exit 1; }
          docker stop rag-smoke
      - name: Smoke Test Sandbox Runner
        run: |
          docker run -d --rm --name sandbox-smoke -p 18093:8093 allcallall-sandbox-runner:ci
          for i in $(seq 1 30); do
            curl -sf http://localhost:18093/health && break
            sleep 1
          done
          curl -sf http://localhost:18093/health | grep -q '"status":"ok"' || { docker logs sandbox-smoke; exit 1; }
          docker stop sandbox-smoke
